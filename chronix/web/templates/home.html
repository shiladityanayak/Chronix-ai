{% extends "base.html" %}

{% block content %}
<div class="text-center py-20">
    <div class="inline-block p-4 rounded-full bg-blue-500/10 mb-6">
        <span class="text-4xl">👋</span>
    </div>
    <h1 class="text-5xl font-bold mb-6 bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">
        Welcome, {{ user['username'] }}!
    </h1>
    <p class="text-gray-400 text-xl mb-10">Ready to manage your servers?</p>

    <a href="{{ url_for('dashboard') }}" class="bg-blue-600 px-8 py-4 rounded-xl text-lg font-bold hover:bg-blue-700 shadow-xl transition transform hover:scale-105 inline-block">
        Go to Dashboard
    </a>
</div>
{% endblock %}
