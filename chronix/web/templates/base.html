<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chronix Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #111827; color: white; }
    </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col">
    <!-- Navbar matching React App -->
    <nav class="flex items-center justify-between px-8 py-6 bg-gray-800/50 backdrop-blur-md sticky top-0 z-50 border-b border-gray-700">
        <a href="/" class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">
            Chronix
        </a>
        <div class="flex items-center space-x-6">
            {% if user %}
                <span class="text-gray-300">Welcome, {{ user['username'] }}</span>
                <a href="/logout" class="text-red-400 hover:text-red-300 transition">Logout</a>
            {% else %}
                <a href="/login" class="bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded-full font-semibold transition shadow-lg shadow-blue-500/30">
                    Login
                </a>
            {% endif %}
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-gray-800 py-10 text-center text-gray-500 border-t border-gray-700 mt-auto">
        <p>&copy; 2024 Chronix Bot. Dashboard.</p>
    </footer>
</body>
</html>
