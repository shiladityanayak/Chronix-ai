<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chronix Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans">
    <nav class="bg-gray-800 p-4 flex justify-between items-center">
        <a href="/" class="text-2xl font-bold text-blue-400">Chronix</a>
        <div>
            {% if user %}
                <span class="mr-4">{{ user['username'] }}</span>
                <a href="/logout" class="text-red-400">Logout</a>
            {% else %}
                <a href="/login" class="bg-blue-600 px-4 py-2 rounded">Login</a>
            {% endif %}
        </div>
    </nav>

    <div class="container mx-auto px-4">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
